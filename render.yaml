# Деплой на Render: New → Blueprint → этот репозиторий.
#
# Секреты (MYSQL_*, JWT_SECRET) Render спросит при создании сервиса и сохранит
# у себя — в git они не попадают. JWT_SECRET генерируется автоматически.
services:
  - type: web
    name: mcskill-trader
    runtime: node
    plan: free
    # TiDB Cloud находится в ap-northeast-1 (Токио) — Сингапур ближе всего.
    region: singapore
    branch: main
    autoDeploy: true
    # NODE_ENV=production отключает devDependencies, поэтому --include=dev:
    # без tsc и vite сборка упадёт.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # В базе уже есть ресурсы, сидирование не нужно.
      - key: SEED_ON_START
        value: "false"
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        sync: false
      # TiDB Cloud пускает только по TLS.
      - key: MYSQL_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
