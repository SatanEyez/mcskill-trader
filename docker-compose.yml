# Опциональный MySQL для McSkill Trader.
# Нужен, если MySQL не установлен локально: docker compose up -d
# и параметры подключения в server/.env (MYSQL_HOST, MYSQL_PORT, MYSQL_USER,
# MYSQL_PASSWORD, MYSQL_DATABASE).
services:
  mysql:
    image: mysql:8.4
    container_name: mcskill-trader-db
    restart: unless-stopped
    command: ['--character-set-server=utf8mb4', '--collation-server=utf8mb4_0900_ai_ci']
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mcskill_trader
      MYSQL_USER: mcskill
      MYSQL_PASSWORD: change-me
    ports:
      - '3306:3306'
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -proot --silent']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysqldata:
